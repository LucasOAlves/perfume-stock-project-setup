services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shared_stock
      POSTGRES_PASSWORD: shared_stock
      POSTGRES_DB: shared_stock
    ports:
      - "5432:5432"
    volumes:
      - shared_stock_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shared_stock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shared_stock_db_data:
